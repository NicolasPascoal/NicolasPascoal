name: dashboard

# Redraws assets/dashboard.svg (and assets/hero.svg) with current GitHub data.
# Commits only when an SVG changes (at most once a day, when the date rolls over).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, assets/fonts/**, .github/workflows/dashboard.yml]

permissions:
  contents: write

concurrency: dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then echo "dashboard unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh dashboard"
          git push
